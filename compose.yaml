services:
  app:
    image: ${IMAGE_NAME:-study-workflow}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: ${PORT:?falta PORT}
    ports:
      - "127.0.0.1:${PORT:?falta PORT}:${PORT:?falta PORT}"
    volumes:
      - "${DATA_DIR:-/srv/study-workflow}:/data"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
