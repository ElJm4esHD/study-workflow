<title>Mockup Study Workflow</title>
<style>
/* Layout: la app vive en .vp (contenedor con container queries). En la compu se puede ver como celu (412 px) o compu. */
:root {
  --bg: #0e1117; --surface: #161b24; --surface-2: #1d2430; --surface-3: #252d3b;
  --line: rgb(255 255 255 / .07); --line-strong: rgb(255 255 255 / .12);
  --text: #e8ebf2; --muted: #a3acbe; --faint: #8790a4;
  --accent: #b7c4ff; --accent-hover: #c7d1ff; --on-accent: #141a33; --accent-soft: rgb(183 196 255 / .14);
  --danger: #ffa3a3; --warn: #ffd38a; --ok: #93dcbf; --on-strong: #fff; --scrim: rgb(5 7 10 / .6);
  --toast-bg: #e8ebf2; --toast-fg: #10131a; --toast-action: #3a4ba8; --frame: #05070a; --frame-edge: #2a2f3a;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;
  --r-chip: 6px; --r-ctl: 10px; --r-card: 14px; --r-sheet: 20px;
  --e1: inset 0 1px 0 rgb(255 255 255 / .04), 0 1px 2px rgb(0 0 0 / .3);
  --e2: 0 8px 24px rgb(0 0 0 / .45); --e3: 0 24px 64px rgb(0 0 0 / .55);
  --ease-out: cubic-bezier(.2,.8,.2,1);
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  display: flex; flex-direction: column; align-items: center; overflow: hidden; -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { flex: none; }
[hidden] { display: none !important; }

/* ===== Barra del mockup (solo en pantallas anchas) ===== */
.deskbar { display: none; }
@media (min-width: 900px) {
  .deskbar { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 12px 16px; font-size: 13px; color: var(--muted); flex: none; }
  .deskbar .seg { width: 260px; }
  body.phone .vp { flex: none; width: 412px; height: min(892px, calc(100% - 100px)); border-radius: 32px; box-shadow: 0 0 0 10px var(--frame), 0 0 0 11px var(--frame-edge), var(--e3); margin-top: 8px; }
}

/* ===== App: tokens dependientes de ajustes (--k velocidad, --fs letra) ===== */
.vp {
  --k: 1; --fs: 1;
  --d-micro: calc(120ms * var(--k)); --d-small: calc(200ms * var(--k)); --d-screen: calc(260ms * var(--k));
  --t-micro: calc(11.5px * var(--fs)); --t-meta: calc(12.5px * var(--fs)); --t-sec: calc(13.5px * var(--fs)); --t-body: calc(15px * var(--fs));
  --t-card: calc(16px * var(--fs)); --t-h2: calc(20px * var(--fs)); --t-page: calc(24px * var(--fs)); --t-display: calc(40px * var(--fs));
  --nav-h: 68px; --side-w: 232px; --gutter: 16px;
  position: relative; flex: 1; width: 100%; min-height: 0; overflow: hidden; container: vp / inline-size; background: var(--bg);
  font-size: var(--t-body); line-height: 1.4; font-variant-numeric: tabular-nums;
}
.vp :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 6px var(--accent-soft); border-radius: var(--r-ctl); }
.scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
.main { padding: 0 var(--gutter) calc(var(--nav-h) + 96px); max-width: 720px; margin: 0 auto; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 0 16px; min-height: 76px; }
.page-head h1 { font-size: var(--t-page); font-weight: 700; letter-spacing: -.02em; margin: 0; line-height: 1.15; text-wrap: balance; }
.page-head .sub { font-size: var(--t-sec); color: var(--muted); font-weight: 500; margin-top: 2px; }
.page-head .actions { display: flex; gap: 8px; align-items: center; }

/* Nav del celu */
.nav { position: absolute; inset: auto 0 0 0; height: var(--nav-h); display: grid; grid-template-columns: repeat(4, 1fr);
  background: rgb(22 27 36 / .88); backdrop-filter: blur(16px) saturate(1.4); border-top: 1px solid var(--line); z-index: 20; }
.nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: 0; color: var(--muted); font-size: 12px; font-weight: 500; }
.nav-item .pill { width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center; position: relative; }
.nav-item .pill::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--accent-soft); transform: scaleX(.4); opacity: 0;
  transition: transform var(--d-screen) var(--ease-out), opacity var(--d-micro); }
.nav-item .pill svg { position: relative; transition: transform var(--d-micro) var(--ease-out); }
.nav-item[aria-current='page'] { color: var(--text); font-weight: 650; }
.nav-item[aria-current='page'] .pill { color: var(--accent); }
.nav-item[aria-current='page'] .pill::before { transform: scaleX(1); opacity: 1; }
.nav-item:active .pill svg { transform: scale(.86); }
.side { display: none; }
.kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; font-size: 11px; font-weight: 600; color: var(--faint); }

/* ===== Componentes ===== */
.btn { min-height: 44px; padding: 0 18px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong); background: var(--surface-2);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: var(--t-sec);
  transition: background var(--d-micro), transform var(--d-micro) var(--ease-out); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.ghost { background: none; border-color: transparent; color: var(--accent); }
.icon-btn { width: 44px; height: 44px; border-radius: var(--r-ctl); border: 0; background: none; color: var(--muted); display: inline-grid; place-items: center;
  transition: background var(--d-micro), color var(--d-micro), transform var(--d-micro) var(--ease-out); }
.icon-btn:active { transform: scale(.9); background: var(--surface-2); }
.fab { position: absolute; right: 16px; bottom: calc(var(--nav-h) + 16px); width: 56px; height: 56px; border-radius: 18px; border: 0; z-index: 19;
  background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: var(--e2); }
.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--e1); padding: var(--s4); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: var(--s3); min-height: 28px; }
.card-head h2 { font-size: var(--t-card); font-weight: 650; margin: 0; display: flex; align-items: center; gap: 8px; }
.card-head h2 svg { color: var(--faint); }
.link { color: var(--accent); font-size: var(--t-sec); font-weight: 600; background: none; border: 0; min-height: 44px; display: inline-flex; align-items: center; gap: 2px; margin: -8px -6px; padding: 0 6px; border-radius: 8px; }
.eyebrow { font-size: var(--t-micro); font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: var(--r-chip); font-size: var(--t-micro); font-weight: 700;
  letter-spacing: .02em; background: color-mix(in srgb, var(--m, var(--muted)) 18%, transparent); color: var(--m, var(--muted)); white-space: nowrap; }
.chip.solid { background: var(--ms); color: var(--on-strong); }
.meta-i { display: inline-flex; align-items: center; gap: 3px; font-size: var(--t-meta); color: var(--muted); font-weight: 500; }
.meta-i svg { width: 13px; height: 13px; }
.meta-i.warn { color: var(--warn); } .meta-i.late { color: var(--danger); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--m, var(--muted)); display: inline-block; flex: none; }

/* Segmentado: el indicador lo mueve Motion */
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border-radius: var(--r-ctl); padding: 3px; box-shadow: var(--e1); }
.seg button { position: relative; z-index: 1; min-height: 38px; border: 0; background: none; color: var(--muted); font-size: var(--t-sec); font-weight: 600; padding: 0 10px; white-space: nowrap; border-radius: 8px; transition: color var(--d-small); }
.seg button[aria-pressed='true'] { color: var(--text); }
.seg .ind { position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 8px; background: var(--surface-3); box-shadow: 0 1px 3px rgb(0 0 0 / .35); }
.seg-scroll { overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter); }
.seg-scroll .seg { width: max-content; grid-auto-columns: auto; }

/* Checkbox */
.chk { width: 44px; height: 44px; flex: none; display: grid; place-items: center; background: none; border: 0; padding: 0; color: var(--m, var(--muted)); }
.chk svg { width: 22px; height: 22px; }
.chk rect { fill: transparent; stroke: currentColor; transition: fill var(--d-small) var(--ease-out); }
.chk .tick { stroke: var(--bg); stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset var(--d-small) var(--ease-out) calc(60ms * var(--k)); }
.done .chk rect, .checking .chk rect { fill: currentColor; }
.done .chk .tick, .checking .chk .tick { stroke-dashoffset: 0; }

/* Fila de tarea (la misma en todas las pantallas) */
.rows { list-style: none; margin: 0; padding: 0; }
.task-row { position: relative; border-radius: var(--r-ctl); touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.row-inner { position: relative; z-index: 1; display: flex; align-items: center; gap: 2px; min-height: 52px; padding-right: 8px; background: var(--surface); border-radius: inherit; transition: background var(--d-micro); }
.row-inner::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--m, transparent); }
.task-row + .task-row .row-inner::after { content: ''; position: absolute; top: 0; left: 52px; right: 0; height: 1px; background: var(--line); }
.task-row .body { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 6px 0; min-height: 44px; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.task-row .title { font-size: var(--t-body); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; transition: color var(--d-small); }
.task-row .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.task-row .meta:empty { display: none; }
.task-row .dur { font-size: var(--t-meta); color: var(--faint); font-weight: 500; }
.task-row .del { display: none; }
.task-row.done .title, .task-row.checking .title { color: var(--faint); text-decoration: line-through; }
.task-row.sel .row-inner { background: var(--surface-2); }
.swipe-bg { position: absolute; inset: 0; border-radius: inherit; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: var(--t-sec); font-weight: 650; opacity: 0; }
.swipe-bg span { display: inline-flex; align-items: center; gap: 6px; transform: scale(calc(.8 + var(--p, 0) * .2)); opacity: calc(.4 + var(--p, 0) * .6); }
.task-row[data-swipe] .swipe-bg { opacity: 1; }
.task-row[data-swipe='done'] .swipe-bg { background: color-mix(in srgb, var(--ok) 22%, var(--surface)); color: var(--ok); }
.task-row[data-swipe='del'] .swipe-bg { background: color-mix(in srgb, var(--danger) 22%, var(--surface)); color: var(--danger); justify-content: flex-end; }
.task-row[data-swipe='done'] .sb-del, .task-row[data-swipe='del'] .sb-done { display: none; }
.task-row.armed .swipe-bg span { transform: scale(1.12); }
.task-row.swiping .row-inner { box-shadow: var(--e2); }
.group { margin-bottom: var(--s5); }
.group-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 8px; }
.group-head .late { color: var(--danger); }
.group .card { padding: 2px 0; }

/* Estados */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 32px 16px; color: var(--muted); font-size: var(--t-sec); }
.empty .ic { width: 52px; height: 52px; border-radius: 16px; background: var(--surface-2); display: grid; place-items: center; color: var(--faint); margin-bottom: 4px; }
.empty b { color: var(--text); font-size: var(--t-body); font-weight: 650; }
.skel { border-radius: 8px; background: linear-gradient(90deg, var(--surface-2) 0 40%, var(--surface-3) 50%, var(--surface-2) 60% 100%) 0 0 / 300% 100%; animation: shimmer 1.2s linear infinite; }
.vp[data-still] .skel { animation: none; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.input { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 6px 0 14px; border-radius: var(--r-ctl); background: var(--surface); box-shadow: var(--e1);
  border: 1px solid transparent; transition: border-color var(--d-micro), background var(--d-micro); color: var(--faint); }
.input:focus-within { border-color: var(--accent); background: var(--surface-2); box-shadow: 0 0 0 4px var(--accent-soft); }
.input input { flex: 1; min-width: 0; border: 0; background: none; outline: none; height: 46px; font-size: var(--t-body); color: var(--text); }
.input input::placeholder { color: var(--faint); }

/* Tirar para refrescar */
.ptr { position: absolute; top: -48px; left: 50%; margin-left: -20px; width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); box-shadow: var(--e2);
  display: grid; place-items: center; color: var(--muted); z-index: 18; opacity: 0; pointer-events: none; transition: background var(--d-small), color var(--d-small); }
.ptr.armed { background: var(--accent); color: var(--on-accent); }
.ptr.spin svg { animation: spin calc(.8s * var(--k) + 0.01s) linear infinite; }
.vp[data-still] .ptr.spin svg { animation: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Hoja (celu) */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 40; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86%; z-index: 41; background: var(--surface); border-radius: var(--r-sheet) var(--r-sheet) 0 0;
  box-shadow: var(--e3); display: flex; flex-direction: column; }
.sheet .grab { flex: none; height: 28px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.sheet .grab::after { content: ''; width: 36px; height: 4px; border-radius: 2px; background: var(--line-strong); }
.sheet-body { overflow-y: auto; padding: 0 var(--gutter) 20px; overscroll-behavior: contain; }
.more-list { list-style: none; margin: 0 0 8px; padding: 0; }
.more-list button { width: 100%; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 8px; background: none; border: 0; border-radius: var(--r-ctl); font-size: var(--t-body); font-weight: 500; text-align: left; }
.more-list button:active { background: var(--surface-2); }
.mi { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; color: var(--accent); flex: none; }
.more-list small, .list-btn small { display: block; color: var(--muted); font-size: var(--t-meta); }

/* Toast */
.toast-zone { position: absolute; left: 0; right: 0; bottom: calc(var(--nav-h) + 16px); display: flex; justify-content: center; z-index: 50; pointer-events: none; padding: 0 16px; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 16px; min-height: 52px; border-radius: var(--r-card); background: var(--toast-bg); color: var(--toast-fg);
  box-shadow: var(--e3); font-weight: 600; font-size: var(--t-sec); max-width: 420px; width: 100%; }
.toast .btn { min-height: 40px; background: none; border: 0; color: var(--toast-action); padding: 0 12px; margin-left: auto; }
.ghosts { position: absolute; inset: 0; pointer-events: none; z-index: 30; }

/* ===== Inicio ===== */
.dash { display: grid; gap: var(--s3); }
.exam-num { font-size: var(--t-display); font-weight: 700; letter-spacing: -.03em; line-height: 1; color: var(--m); display: flex; align-items: baseline; gap: 8px; }
.exam-num small { font-size: var(--t-card); font-weight: 600; color: var(--muted); letter-spacing: 0; }
.exam-title { display: flex; align-items: center; gap: 8px; margin: 12px 0 2px; font-weight: 650; font-size: var(--t-card); }
.ruler { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 16px; }
.ruler b { height: 24px; border-radius: 6px; background: var(--surface-2); transform-origin: bottom; }
.ruler b[data-l='1'] { background: color-mix(in srgb, var(--m) 26%, var(--surface-2)); }
.ruler b[data-l='2'] { background: color-mix(in srgb, var(--m) 52%, var(--surface-2)); }
.ruler b[data-l='3'] { background: color-mix(in srgb, var(--m) 80%, var(--surface-2)); }
.ruler b.exam { background: var(--ms); }
.ruler-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; text-align: center; }
.ruler-days span { font-size: 11px; font-weight: 600; color: var(--faint); }
.ruler-days span.today { color: var(--accent); }
.next-line { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: var(--t-sec); color: var(--muted); }
.progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin: 4px 0 8px; }
.progress i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transform-origin: left; }
.hoy-sum { display: flex; justify-content: space-between; font-size: var(--t-sec); color: var(--muted); font-weight: 500; }
.heat { display: grid; grid-template-columns: minmax(0, 1.6fr) 5fr auto; align-items: center; gap: 4px 10px; }
.heat .name { display: flex; align-items: center; gap: 8px; font-size: var(--t-sec); min-width: 0; }
.heat .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.heat .ruler { margin: 0; gap: 3px; }
.heat .ruler b { height: 20px; border-radius: 5px; }
.heat .tot { font-size: var(--t-meta); color: var(--faint); text-align: right; white-space: nowrap; }

/* ===== Calendario ===== */
.cal-head { display: flex; align-items: center; gap: 4px; }
.cal-tools { display: flex; gap: 8px; align-items: center; margin-bottom: var(--s3); }
.cal-tools .seg { flex: 1; max-width: 240px; }
.month { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--e1); padding: 8px 6px; }
.dow { display: grid; grid-template-columns: repeat(7, 1fr); padding-bottom: 4px; }
.dow span { text-align: center; font-size: var(--t-micro); font-weight: 650; color: var(--faint); letter-spacing: .04em; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 64px; gap: 2px; }
.day { min-width: 0; position: relative; border: 0; background: none; border-radius: 10px; padding: 6px 2px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  color: var(--text); transition: background var(--d-micro), transform var(--d-micro) var(--ease-out); }
.day:active { transform: scale(.94); }
.day .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: var(--t-sec); font-weight: 600; }
.day.out { color: var(--faint); opacity: .55; }
.day.today .n { background: var(--accent); color: var(--on-accent); }
.day.sel { background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.day .dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 36px; }
.day .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--m); }
.day .dots i.is-ev { background: none; box-shadow: inset 0 0 0 1.5px var(--m); }
.day.exam { background: var(--ms); color: var(--on-strong); }
.day.exam .n { background: rgb(0 0 0 / .22); }
.day.exam .ex { font-size: 10.5px; font-weight: 700; line-height: 1.1; text-align: center; }
.day.exam .ex small { display: block; font-weight: 600; opacity: .9; }
.day.exam.sel { box-shadow: inset 0 0 0 2px var(--on-strong); }
.day .items { display: none; }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; padding: 12px 4px 0; font-size: var(--t-meta); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .ring { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--muted); }
.week { display: grid; gap: 8px; }
.wday { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--e1); padding: 10px 12px; display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; border: 0; text-align: left; width: 100%; }
.wday .wd { display: flex; flex-direction: column; align-items: center; font-size: var(--t-micro); color: var(--faint); font-weight: 650; }
.wday .wd b { font-size: 18px; color: var(--text); }
.wday.today .wd b { color: var(--accent); }
.wday .its { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ev-line { display: flex; align-items: center; gap: 8px; font-size: var(--t-sec); min-width: 0; }
.ev-line .t { color: var(--faint); font-size: var(--t-meta); font-weight: 600; width: 40px; flex: none; }
.ev-line .x { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-line.exam .x { font-weight: 700; color: var(--m); }
.wday .none { font-size: var(--t-sec); color: var(--faint); padding-top: 6px; }

/* Panel del día / detalle (compartido hoja y panel) */

  else if (S.screen === 'cal' && e.key === 'ArrowRight') shift(1); else if (S.screen === 'cal' && e.key === 'ArrowLeft') shift(-1);
  else if (S.screen === 'cal' && k === 't') main.querySelector('[data-today]')?.click();
});

// ===== Arranque =====
const isWideWindow = matchMedia('(min-width: 900px)').matches;
document.body.classList.toggle('phone', isWideWindow);
main.innerHTML = skeleton();
requestAnimationFrame(() => segInd(frameSeg));
setTimeout(() => { render(); reveal(); }, kk() ? 600 : 200);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 120); });
</script>
